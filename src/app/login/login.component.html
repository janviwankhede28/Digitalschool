<body class="bg-gradient-to-right"
  style="background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%); min-height: 100vh;">

  <div class="container-fluid min-vh-100 position-relative overflow-hidden">

    <!-- Background decorative elements using Bootstrap -->
    <div class="position-absolute top-0 start-0 w-100 h-100" style="z-index: 0;">
      <!-- Left decorative element -->
      <div class="position-absolute bottom-0 start-0 bg-success bg-opacity-10"
        style="width: 300px; height: 400px; clip-path: polygon(0 100%, 40% 0, 0 0);">
      </div>

      <!-- Right decorative element -->
      <div class="position-absolute bottom-0 end-0 bg-info bg-opacity-10"
        style="width: 350px; height: 450px; clip-path: polygon(100% 100%, 100% 0, 60% 0);">
      </div>

      <!-- Floating dots -->
      <div class="position-absolute top-10 start-15 bg-success rounded-circle"
        style="width: 40px; height: 40px; opacity: 0.1;"></div>
      <div class="position-absolute top-20 end-20 bg-success rounded-circle"
        style="width: 30px; height: 30px; opacity: 0.1;"></div>
      <div class="position-absolute bottom-30 start-25 bg-success rounded-circle"
        style="width: 35px; height: 35px; opacity: 0.1;"></div>
      <div class="position-absolute bottom-20 end-30 bg-success rounded-circle"
        style="width: 45px; height: 45px; opacity: 0.1;"></div>
    </div>

    <!-- Main Content -->
    <div class="row justify-content-center align-items-center min-vh-100 position-relative" style="z-index: 1;">
      <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">

        <!-- Login Card -->
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

          <!-- Card Header with Gradient -->
          <div class="card-header border-0 py-4 px-4 px-md-5"
            style="background: linear-gradient(135deg, #57564b 0%, #f6f337 100%);">

            <div class="row align-items-center">
              <!-- Close Button -->
              <div class="col-auto">
                <button class="btn btn-light btn-sm rounded-circle p-2" style="width: 36px; height: 36px;"
                  (click)="goHome()">
                  <i class="bi bi-x-lg text-dark"></i>
                </button>
              </div>

              <!-- Logo and Title -->
              <div class="col text-center">
                <div class="d-flex flex-column align-items-center">
                  <div
                    class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center mb-3"
                    style="width: 80px; height: 80px; border: 3px solid rgba(255,255,255,0.3);">
                    <i class="bi bi-tree-fill text-white fs-1"></i>
                  </div>
                  <h1 class="text-white fw-bold mb-1 display-6">Welcome Back</h1>
                  <p class="text-white-50 mb-0">Sign in to your account</p>
                </div>
              </div>

              <!-- Empty column for balance -->
              <div class="col-auto" style="width: 36px;"></div>
            </div>
          </div>

          <!-- Card Body -->
          <div class="card-body p-4 p-md-5 bg-white">

            <!-- Sign Up Link -->
            <!-- <div class="text-center mb-4">
              <p class="text-muted mb-0">
                Don't have an account?
                <a href="#" class="text-decoration-none fw-bold text-success">
                  Sign Up Now
                </a>

              </p>
            </div> -->

            <!-- Login Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

              <!-- Email Input -->
              <div class="mb-4">
                <label class="form-label fw-semibold text-dark">Email Address</label>
                <div class="input-group input-group-lg shadow-sm">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-envelope-fill text-success"></i>
                  </span>
                  <input type="email" class="form-control border-start-0 ps-0" placeholder="Enter your email"
                    formControlName="username"
                    [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                </div>
                <div class="invalid-feedback d-block mt-1"
                  *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                  Please enter a valid email address
                </div>
              </div>

              <!-- Password Input -->
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <label class="form-label fw-semibold text-dark">Password</label>
                  <a href="#" class="text-decoration-none text-success fw-semibold small">
                    Forgot Password?
                  </a>
                </div>
                <div class="input-group input-group-lg shadow-sm">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock-fill text-success"></i>
                  </span>
                  <input [type]="showPassword ? 'text' : 'password'" class="form-control border-start-0 ps-0"
                    placeholder="Enter your password" formControlName="password"
                    [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                  <button class="btn btn-light border-start-0" type="button" (click)="togglePassword()">
                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                  </button>
                </div>
                <div class="invalid-feedback d-block mt-1"
                  *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                  Password must be at least 6 characters
                </div>
              </div>

              <!-- Remember Me Checkbox -->
              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label text-muted" for="rememberMe">
                    Remember me for 30 days
                  </label>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-4">
                <button type="submit" class="btn btn-lg fw-bold text-white shadow-sm" [disabled]="loginForm.invalid"
                  style="background: linear-gradient(135deg, #6d6c64 0%, #d7dc42 100%); height: 56px;">
                  Sign In
                  <i class="bi bi-arrow-right ms-2"></i>
                </button>
              </div>

              <!-- Divider -->
              <div class="position-relative text-center my-4">
                <hr class="text-muted">
                <!-- <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">
                  Or continue with
                </span> -->
              </div>

              <!-- Social Login Buttons -->
              <!-- <div class="row g-3 mb-4">
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark w-100 py-3 rounded-3">
                    <i class="bi bi-google me-2"></i> Google
                  </button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-outline-primary w-100 py-3 rounded-3">
                    <i class="bi bi-facebook me-2"></i> Facebook
                  </button>
                </div>
              </div> -->

              <!-- Additional Info -->
              <div class="text-center">
                <p class="text-muted small mb-0">
                  By signing in, you agree to our
                  <a href="#" class="text-decoration-none text-warning fw-semibold">Terms of Service</a>
                  and
                  <a href="#" class="text-decoration-none text-warning fw-semibold">Privacy Policy</a>
                </p>
              </div>

            </form>



            <!-- Card Footer -->
            <div class="card-footer border-0 py-3 text-center bg-light">
              <p class="text-muted small mb-0">
                <i class="bi bi-shield-check text-success me-1"></i>
                Protected by advanced security
              </p>
            </div>

          </div>

          <!-- Features Section Below Card -->
          <div class="row mt-2 text-center mb-3">
            <div class="col-12 col-md-4 mb-3 mb-md-0">
              <div class="d-flex align-items-center justify-content-center">
                <div class="bg-success bg-opacity-10 rounded-circle p-2 me-2">
                  <i class="bi bi-lightning-charge-fill text-success"></i>
                </div>
                <span class="small fw-semibold">Fast & Secure</span>
              </div>
            </div>
            <div class="col-12 col-md-4 mb-3 mb-md-0">
              <div class="d-flex align-items-center justify-content-center">
                <div class="bg-success bg-opacity-10 rounded-circle p-2 me-2">
                  <i class="bi bi-bar-chart-fill text-success"></i>
                </div>
                <span class="small fw-semibold">Advanced Analytics</span>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="d-flex align-items-center justify-content-center">
                <div class="bg-success bg-opacity-10 rounded-circle p-2 me-2">
                  <i class="bi bi-headset text-success"></i>
                </div>
                <span class="small fw-semibold">24/7 Support</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
